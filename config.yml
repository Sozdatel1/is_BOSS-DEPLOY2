      Hash: 2048 # Max memory (in megabytes) the engine can allocate.
      Move Overhead: 300 # Increase if your bot flags games too often.
      Contempt: 0
    limits: # Limits that end the move calculation early.
    
  1+1: # Engine used for standard chess and when no suitable special engine is configured.
    dir: "./engines" # Directory containing the engine.
    name: "stockfish-ubuntu-x86-64-bmi2" # Binary name of the engine to use.
    ponder: true # Think on opponent's time.
    silence_stderr: false # Suppresses stderr output.
    move_overhead_multiplier: 5.3 # Increase if your bot flags games too often. Default move overhead is 1 second per 1 minute initital time.
    uci_options: # Arbitrary UCI options passed to the engine.
      Threads: 12 # Max CPU threads the engine can use.
      Hash: 2048 # Max memory (in megabytes) the engine can allocate.
      Move Overhead: 300 # Increase if your bot flags games too often.
      Contempt: 0
    limits: # Limits that end the move calculation early.

  2+1: # Engine used for standard chess and when no suitable special engine is configured.
    dir: "./engines" # Directory containing the engine.
    name: "stockfish-ubuntu-x86-64-bmi2" # Binary name of the engine to use.
    ponder: true # Think on opponent's time.
    silence_stderr: false # Suppresses stderr output.
    move_overhead_multiplier: 5.3 # Increase if your bot flags games too often. Default move overhead is 1 second per 1 minute initital time.
    uci_options: # Arbitrary UCI options passed to the engine.
      Threads: 12 # Max CPU threads the engine can use.
      Hash: 2048 # Max memory (in megabytes) the engine can allocate.
      Move Overhead: 300 # Increase if your bot flags games too often.
      Contempt: 0
    limits: # Limits that end the move calculation early.
    
  standard:
    dir: "./engines"
    name: "stockfish-ubuntu-x86-64-bmi2"
    ponder: true
    silence_stderr: false
    move_overhead_multiplier: 5.0
    uci_options:
      Threads: 8
      Hash: 4100
      Move Overhead: 100
      Contempt: 0
    limits:
      # time: 20.0
      # depth: 50
      # nodes: 8000000

  variants:
    dir: "./engines"
    name: "fairy-stockfish_x86-64-bmi2"
    ponder: false
    silence_stderr: false
    move_overhead_multiplier: 5.0
    uci_options:
      Threads: 4
      Hash: 4100
      Move Overhead: 200
      # antichess-dd3cbe53cd4e.nnue:
      # horde-28173ddccabe.nnue:
      EvalFile: "crazyhouse-8ebf84784ad2.nnue:kingofthehill-978b86d0e6a4.nnue:atomic-2cf13ff256cc.nnue:3check-cb5f517c228b.nnue:racingkings-636b95f085e3.nnue"
    limits:
     # time: 20.0
     # depth: 50
     # nodes: 5000000

syzygy:
  standard:
    enabled: true
    paths:
      - "./engines/syzygy"
    max_pieces: 7
    instant_play: true
  antichess:
    enabled: false
    paths:
      - "/path/to/antichess/syzygy"
    max_pieces: 6
    instant_play: true
  atomic:
    enabled: false
    paths:
      - "/path/to/atomic/syzygy"
    max_pieces: 6
    instant_play: true

