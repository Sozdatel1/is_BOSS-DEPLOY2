name: Download and Commit Stockfish

on:
  workflow_dispatch:

jobs:
  download_and_commit_stockfish:
    runs-on: ubuntu-latest
    
    # Даем экшену железные права на изменение контента
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Подставляем твой созданный Classic Token с правами repo и workflow
          token: ${{ secrets.BOT_TOKEN }}

            # ... шаги скачивания и распаковки остаются те же ...

       Tar -xf stockfish.tar

      - name: Move Stockfish binary to engines folder
        run: |
          Mkdir -p engines
          
          # Забираем файл 'stockfish' (он создался после распаковки) 
          # и перемещаем его в папку engines под твоим рабочим именем
          Mv stockfish engines/stockfish-ubuntu-x86-64-bmi2
          
          # Выдаем права на запуск
          Chmod +x engines/stockfish-ubuntu-x86-64-bmi2

      - name: Clean up
        run: rm -f stockfish.tar

      - name: Commit and push changes
        run: |
          # Настраиваем системного гит-бота для подписи коммита
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add engines/stockfish-ubuntu-x86-64-bmi2
          
          # Умная проверка: если движок один и тот же, пуш отменяется, чтобы билд не падал
          if git diff --staged --quiet; then
            echo "Движок не изменился, репозиторий уже обновлен."
          else
            git commit -m "Update Stockfish binary to sf18"
            git push origin main
          fi

