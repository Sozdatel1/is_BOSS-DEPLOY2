name: Download and Commit Stockfish

on:
  workflow_dispatch:

jobs:
  download_and_commit_stockfish:
    runs-on: ubuntu-latest
    
    # Даем экшену железные права на изменение контента
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Подставляем твой созданный Classic Token с правами repo и workflow
          token: ${{ secrets.BOT_TOKEN }}

      - name: Download and extract Stockfish
        run: |
          # 1. Скачиваем официальный .tar архив для Ubuntu
          curl -L "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-bmi2.tar" -o stockfish.tar
          
          # 2. Распаковываем чистый tar без флага -z
          tar -xf stockfish.tar
      

      - name: Move Stockfish binary to engines folder
        run: |
          mkdir -p engines
          
          # Если файл внутри папки, этот скрипт найдет его и перенесет куда надо
          if [ -d "stockfish-ubuntu-x86-64-bmi2" ]; then
            mv stockfish-ubuntu-x86-64-bmi2/stockfish-ubuntu-x86-64-bmi2 engines/
          else
            mv stockfish-ubuntu-x86-64-bmi2 engines/
          fi
          
          chmod +x engines/stockfish-ubuntu-x86-64-bmi2


      - name: Clean up
        run: rm -f stockfish.tar

      - name: Commit and push changes
        run: |
          # Настраиваем системного гит-бота для подписи коммита
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add engines/stockfish-ubuntu-x86-64-bmi2
          
          # Умная проверка: если движок один и тот же, пуш отменяется, чтобы билд не падал
          if git diff --staged --quiet; then
            echo "Движок не изменился, репозиторий уже обновлен."
          else
            git commit -m "Update Stockfish binary to sf18"
            git push origin main
          fi

