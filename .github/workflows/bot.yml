name: Run bot
on: 
  workflow_dispatch:
  push: 
    branches:
      - "main"
    paths:
      - "user_interface.py"
  schedule:
    - cron: "1 */5 * * *"  # Every 5 hours at minute 1

jobs:
  build:
    concurrency:
      group: bot-run
      cancel-in-progress: false  # Keep this false for fastest restarts

    runs-on: ubuntu-latest
    timeout-minutes: 355  # Just under 6-hour GitHub limit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Inject Secret Token
        run: sed -i "s/TokenTimeIsBackBuddys/${{ secrets.LICHESS_KEY }}/g" config.yml
      - name: Inject Dev Log into Python Code
        run: |
          # Находим строчку с syzygy_config и сразу после нее принудительно вставляем наш принт
          sed -i '/syzygy_config = cls._get_syzygy_config(config, board)/a \        print(f"[DEV INFO] Бот выбрал режим из config.yml: >>> {engine_key} <<<")' user_interface.py 2>/dev/null || true
          sed -i '/syzygy_config = cls._get_syzygy_config(config, board)/a \        print(f"[DEV INFO] Бот выбрал режим из config.yml: >>> {engine_key} <<<")' lichess_game.py 2>/dev/null || true
      - name: Download Stockfish directly into Container
        run: |
          mkdir -p engines
          
          # 1. Скачиваем официальный .tar архив Stockfish 19
          curl -L "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz" -o stockfish.tar
          
          # 2. Распаковываем его в текущую директорию (без флага -C engines)
          tar -xf stockfish.tar
          
          # 3. Забираем файл 'stockfish' из распакованной папки и кладем в engines под нужным именем
          mv stockfish-linux-x86-64-universal/stockfish/stockfish-linux-x86-64-universal engines/stockfish-ubuntu-x86-64-bmi2
          
          # 4. Полностью удаляем временный архив и папку с исходниками
          rm -f stockfish.tar
          rm -rf stockfish-linux-x86-64-universal
      - name: Make Stockfish Executable
        run: | 
             chmod +x ./engines/stockfish-ubuntu-x86-64-bmi2
             chmod +x ./engines/fairy-stockfish_x86-64-bmi2

      - name: Run Bot
        run: |
          echo "Starting bot..."
          python3 -u user_interface.py "tournament XlJFwdf5 the_necrominds" "matchmaking" &
          PID=$!
          
          # Auto-exit after 350 minutes (so restart runs without overlap)
          ( sleep 20700 && echo "Time up. Killing bot..." && kill -SIGTERM $PID ) &
          
          wait $PID
          echo "Bot ended cleanly."

      - name: 🔁 Self-Restart (Fire-and-Forget)
        if: always()
        run: gh workflow run bot.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
























